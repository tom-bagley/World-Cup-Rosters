<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>World Cup Family Standings</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, Helvetica, sans-serif;
      background: #f6f7f9;
      color: #172033;
      --ink: #172033;
      --muted: #667085;
      --line: #d0d7e2;
      --surface: #ffffff;
      --green: #087443;
      --red: #b42318;
      --gold: #f1bf00;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;
      background:
        linear-gradient(145deg, #eef2f7, #dbe4ef);
      color: var(--ink);
    }
    main {
      max-width: 1180px;
      margin: 0 auto;
    }
    header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 18px;
      border-bottom: 4px solid #0f172a;
      border-radius: 8px;
      background: #172033;
      color: #ffffff;
      padding: 24px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.2);
    }
    h1 {
      margin: 0 0 6px;
      font-size: 42px;
      line-height: 1.12;
    }
    .meta {
      margin: 0;
      color: #d0d7e2;
      font-size: 14px;
    }
    .nav-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 38px;
      border: 1px solid rgba(255, 255, 255, 0.34);
      border-radius: 6px;
      color: #ffffff;
      padding: 8px 12px;
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
    }
    .nav-link:hover {
      background: rgba(255, 255, 255, 0.1);
    }
    .leader-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 14px;
    }
    .pill {
      border: 1px solid #d0d7e2;
      border-radius: 999px;
      background: #ffffff;
      padding: 7px 11px;
      color: #172033;
      font-size: 14px;
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.08);
    }
    .scoring-card {
      overflow: hidden;
      margin-top: 14px;
      border: 1px solid #d0d7e2;
      border-radius: 8px;
      background: #ffffff;
      box-shadow: 0 18px 42px rgba(15, 23, 42, 0.1);
    }
    .scoring-card h2 {
      margin: 0;
      border-bottom: 1px solid #edf0f5;
      background: #172033;
      color: #ffffff;
      padding: 11px 14px;
      font-size: 16px;
    }
    .scoring-table {
      width: 100%;
      border-collapse: collapse;
    }
    .scoring-table th,
    .scoring-table td {
      padding: 9px 14px;
      border-bottom: 1px solid #edf0f5;
      text-align: left;
      font-size: 14px;
    }
    .scoring-table tr:last-child td {
      border-bottom: 0;
    }
    .scoring-table th {
      background: #f8fafc;
      color: #475467;
      font-size: 12px;
      text-transform: uppercase;
    }
    .scoring-table td:last-child,
    .scoring-table th:last-child {
      width: 110px;
      text-align: right;
      font-weight: 800;
    }
    .standings-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }
    .player-card {
      display: grid;
      grid-template-columns: 180px minmax(0, 1fr);
      align-items: start;
      gap: 16px;
      border: 1px solid #d0d7e2;
      border-radius: 8px;
      background: var(--surface);
      padding: 16px;
      box-shadow: 0 18px 42px rgba(15, 23, 42, 0.12);
    }
    .player-card.leader {
      border-color: #d9a441;
      box-shadow: 0 18px 42px rgba(120, 75, 0, 0.16);
    }
    .player-head {
      display: grid;
      align-content: start;
      gap: 10px;
    }
    h2 {
      margin: 0;
      font-size: 24px;
      line-height: 1.15;
    }
    .total {
      display: grid;
      width: 92px;
      gap: 2px;
      border-radius: 6px;
      background: #172033;
      color: #ffffff;
      padding: 8px 10px;
      text-align: center;
    }
    .total strong {
      font-size: 24px;
      line-height: 1;
    }
    .total span {
      color: #d0d7e2;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
    }
    .team-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
    }
    .team-list > li {
      position: relative;
      z-index: 0;
    }
    .team-list > li:has(.estimate-details:hover),
    .team-list > li:has(.estimate-details:focus-within) {
      z-index: 1000;
    }
    .team-item {
      position: relative;
      z-index: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: stretch;
      min-height: 46px;
      border: 1px solid color-mix(in srgb, var(--team-primary), #ffffff 72%);
      border-radius: 6px;
      background:
        linear-gradient(90deg, color-mix(in srgb, var(--team-primary), #ffffff 86%), #ffffff 56%),
        var(--team-secondary);
      box-shadow: inset 4px 0 0 var(--team-primary);
    }
    .team-item:hover {
      transform: translateY(-1px);
      box-shadow:
        inset 4px 0 0 var(--team-primary),
        0 8px 18px rgba(15, 23, 42, 0.12);
    }
    .team-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-width: 0;
      color: inherit;
      padding: 8px 6px 8px 10px;
      text-decoration: none;
    }
    .team-identity {
      display: inline-flex;
      align-items: center;
      min-width: 0;
      gap: 9px;
    }
    .team-identity > span {
      display: grid;
      min-width: 0;
      gap: 1px;
    }
    .team-flag {
      width: 34px;
      height: 23px;
      border: 1px solid rgba(15, 23, 42, 0.2);
      border-radius: 3px;
      object-fit: cover;
      background: var(--team-secondary);
      box-shadow: 0 4px 8px rgba(15, 23, 42, 0.12);
      flex: 0 0 auto;
    }
    .team-name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 700;
    }
    .team-points {
      min-width: 44px;
      border-radius: 999px;
      background: #eef2f7;
      color: #172033;
      padding: 4px 8px;
      text-align: center;
      font-weight: 800;
    }
    .team-values {
      display: grid;
      flex: 0 0 auto;
      gap: 3px;
      justify-items: end;
      text-align: right;
      padding: 6px 10px 6px 0;
    }
    .team-estimate {
      appearance: none;
      border: 0;
      border-radius: 4px;
      background: transparent;
      color: #475467;
      cursor: help;
      font-size: 11px;
      font-weight: 800;
      list-style: none;
      padding: 2px 0;
      white-space: nowrap;
    }
    .team-estimate:hover {
      color: #172033;
      text-decoration: underline;
      text-underline-offset: 2px;
    }
    .estimate-details:hover .team-estimate,
    .estimate-details:focus-within .team-estimate,
    .estimate-details.is-open .team-estimate {
      color: #172033;
    }
    .estimate-popover {
      display: none;
      position: absolute;
      z-index: 10000;
      top: calc(100% + 6px);
      right: 0;
      width: min(320px, calc(100vw - 28px));
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background: #ffffff;
      box-shadow: 0 18px 38px rgba(15, 23, 42, 0.22);
      padding: 10px;
      text-align: left;
    }
    .estimate-details:hover .estimate-popover,
    .estimate-details:focus-within .estimate-popover,
    .estimate-details.is-open .estimate-popover {
      display: block;
    }
    .estimate-popover h3 {
      margin: 0 0 8px;
      font-size: 13px;
      line-height: 1.2;
    }
    .estimate-section-title {
      margin: 10px 0 4px;
      color: #475467;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0;
      text-transform: uppercase;
    }
    .estimate-popover h3 + .estimate-section-title {
      margin-top: 0;
    }
    .estimate-table {
      width: 100%;
      border-collapse: collapse;
    }
    .estimate-table th,
    .estimate-table td {
      border-bottom: 1px solid #edf0f5;
      padding: 5px 0;
      font-size: 11px;
    }
    .estimate-table th {
      color: #667085;
      font-weight: 800;
      text-align: right;
      text-transform: uppercase;
    }
    .estimate-table th:first-child,
    .estimate-table td:first-child {
      text-align: left;
    }
    .estimate-table td:not(:first-child) {
      text-align: right;
      font-weight: 700;
    }
    .estimate-total td {
      border-bottom: 0;
      color: #172033;
      font-weight: 900;
    }
    .score-detail {
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
    }
    .empty-note {
      color: var(--muted);
      font-size: 14px;
    }
    @media (max-width: 900px) {
      .player-card {
        grid-template-columns: 150px minmax(0, 1fr);
      }
      .team-list {
        grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      }
    }
    @media (max-width: 640px) {
      body {
        padding: 10px;
      }
      header {
        align-items: stretch;
        flex-direction: column;
        gap: 12px;
        margin-bottom: 10px;
        padding: 14px;
      }
      h1 {
        font-size: 27px;
      }
      .standings-grid {
        grid-template-columns: 1fr;
        gap: 10px;
      }
      .player-card {
        grid-template-columns: 1fr;
        padding: 12px;
      }
      .player-head {
        grid-template-columns: 1fr auto;
        align-items: start;
      }
      .team-list {
        grid-template-columns: 1fr;
      }
      .estimate-popover {
        right: 0;
      }
      h2 {
        font-size: 21px;
      }
    }
  </style>
</head>

    const normalizedTeamExpectedSeasonPoints = Object.fromEntries(
      Object.entries(teamExpectedSeasonPoints).map(([name, points]) => [normalize(name), points])
    );
    const normalizedTeamExpectedPointBreakdowns = Object.fromEntries(
      Object.entries(teamExpectedPointBreakdowns).map(([name, breakdown]) => [normalize(name), breakdown])
    );
    let teamStats = {};

    function totalPoints(player) {
      return player.teams.reduce((sum, team) => sum + teamScore(team.name).total, 0);
    }

    function renderStandings() {
      const rankedPlayers = [...players].sort((left, right) => totalPoints(right) - totalPoints(left));
      const leaderTotal = totalPoints(rankedPlayers[0] || { teams: [] });

      leaderStrip.innerHTML = [
        ['Leader', rankedPlayers[0]?.name || '-'],
        ['Top score', leaderTotal],
        ['Players', players.length],
        ['Scoring', '3W 1D 1G + stage'],
      ].map(([label, value]) => `<span class="pill">${label}: <strong>${escapeHtml(value)}</strong></span>`).join('');

      standingsGrid.innerHTML = rankedPlayers.map(player => {
        const total = totalPoints(player);
        const isLeader = total === leaderTotal && leaderTotal > 0;
        return `
          <article class="player-card ${isLeader ? 'leader' : ''}">
            <div class="player-head">
              <h2>${escapeHtml(player.name)}</h2>
              <div class="total">
                <strong>${escapeHtml(total)}</strong>
                <span>Total</span>
              </div>
            </div>
            ${teamListMarkup(player.teams)}
          </article>
        `;
      }).join('');
    }

    function teamListMarkup(teams) {
      if (!teams.length) {
        return '<p class="empty-note">Teams coming soon.</p>';
      }
      return `
        <ul class="team-list">
          ${rankedTeams(teams).map(team => {
            const theme = teamThemes[team.name] || fallbackTheme;
            const score = teamScore(team.name);
            const estimatedRos = estimatedRestOfSeasonPoints(team.name);
            const breakdown = expectedPointBreakdown(team.name);
            return `
            <li class="team-item" style="--team-primary: ${escapeHtml(theme.primary)}; --team-secondary: ${escapeHtml(theme.secondary)};">
              <a class="team-row" href="index.html?team=${encodeURIComponent(rosterTeamName(team.name))}">
                <span class="team-identity">
                  ${flagMarkup(team.name, theme)}
                  <span>
                    <span class="team-name">${escapeHtml(team.name)}</span>
                    <span class="score-detail">${escapeHtml(scoreLabel(score))}</span>
                  </span>
                </span>
                <span class="team-points">${escapeHtml(score.total)}</span>
              </a>
              <span class="team-values estimate-details">
                <span class="team-estimate" role="button" tabindex="0" aria-label="${escapeHtml(team.name)} projected rest of season points">${escapeHtml(formatEstimate(estimatedRos))} ROS</span>
                ${estimateBreakdownMarkup(team.name, breakdown)}
              </span>
            </li>
          `}).join('')}
        </ul>
      `;
    }

    const fallbackTheme = { primary: '#172033', secondary: '#d0d7e2', flagCode: '' };

    function rankedTeams(teams) {
      return [...teams].sort((left, right) => {
        const scoreDifference = teamScore(right.name).total - teamScore(left.name).total;
        if (scoreDifference !== 0) {
          return scoreDifference;
        }
        return left.name.localeCompare(right.name);
      });
    }

    function teamScore(teamName) {
      const stats = teamStats[teamName] || { wins: 0, draws: 0, goals: 0 };
      const stage = teamStageStatus[teamName] || '';
      const stageBonus = scoringRules.stageBonuses[stage] || 0;
      const matchPoints =
        (stats.wins * scoringRules.win) +
        (stats.draws * scoringRules.draw) +
        (stats.goals * scoringRules.goal);
      return {
        wins: stats.wins,
        draws: stats.draws,
        goals: stats.goals,
        stageBonus,
        total: matchPoints + stageBonus,
      };
    }

    function estimatedRestOfSeasonPoints(teamName) {
      const expectedTotal = expectedSeasonPoints(teamName);
      if (expectedTotal === null) {
        return null;
      }
      return expectedTotal;
    }

    function expectedSeasonPoints(teamName) {
      const candidates = [teamName, ...(teamAliases[teamName] || [])];
      for (const candidate of candidates) {
        const points = normalizedTeamExpectedSeasonPoints[normalize(candidate)];
        if (typeof points === 'number') {
          return points;
        }
      }
      return null;
    }

    function expectedPointBreakdown(teamName) {
      const candidates = [teamName, ...(teamAliases[teamName] || [])];
      for (const candidate of candidates) {
        const breakdown = normalizedTeamExpectedPointBreakdowns[normalize(candidate)];
        if (breakdown) {
          return breakdown;
        }
      }
      return null;
    }

    function estimateBreakdownMarkup(teamName, breakdown) {
      if (!breakdown) {
        return `
          <div class="estimate-popover">
            <h3>${escapeHtml(teamName)} expected points</h3>
            <p class="empty-note">Breakdown unavailable.</p>
          </div>
        `;
      }

      const expectedStats = breakdown.parts.filter(part => part.probability === '');
      const bonusStats = breakdown.parts.filter(part => part.probability !== '');

      return `
        <div class="estimate-popover">
          <h3>${escapeHtml(teamName)} expected points</h3>
          <div class="estimate-section-title">Scoring production</div>
          ${expectedStatsTableMarkup(expectedStats)}
          <div class="estimate-section-title">Bonus probabilities</div>
          ${bonusStatsTableMarkup(bonusStats)}
          <table class="estimate-table">
            <tbody>
              <tr class="estimate-total">
                <td>Rest of season</td>
                <td></td>
                <td></td>
                <td>${escapeHtml(formatEstimate(breakdown.total))}</td>
              </tr>
            </tbody>
          </table>
        </div>
      `;
    }

    function expectedStatsTableMarkup(parts) {
      return `
        <table class="estimate-table">
          <thead>
            <tr>
              <th>Source</th>
              <th>Unit</th>
              <th>Remaining expected</th>
              <th>Exp</th>
            </tr>
          </thead>
          <tbody>
            ${parts.map(part => `
              <tr>
                <td>${escapeHtml(productionLabel(part.label))}</td>
                <td>${escapeHtml(part.pointsAvailable)}</td>
                <td>${escapeHtml(formatEstimate(expectedUnits(part)))}</td>
                <td>${escapeHtml(formatEstimate(part.expected))}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    }

    function bonusStatsTableMarkup(parts) {
      return `
        <table class="estimate-table">
          <thead>
            <tr>
              <th>Source</th>
              <th>Unit</th>
              <th>Prob</th>
              <th>Exp</th>
            </tr>
          </thead>
          <tbody>
            ${parts.map(part => `
              <tr>
                <td>${escapeHtml(part.label)}</td>
                <td>${escapeHtml(part.pointsAvailable)}</td>
                <td>${escapeHtml(formatProbability(part.probability))}</td>
                <td>${escapeHtml(formatEstimate(part.expected))}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    }

    function expectedUnits(part) {
      const unitValue = Number(part.pointsAvailable);
      return unitValue > 0 ? part.expected / unitValue : part.expected;
    }

    function productionLabel(label) {
      return {
        'Expected wins': 'Group wins',
        'Expected draws': 'Group draws',
        'Expected goals': 'Goals',
      }[label] || label.replace('Expected ', '');
    }

    function formatEstimate(value) {
      return value === null ? '-' : value.toFixed(1);
    }

    function formatProbability(value) {
      if (value === '') {
        return '-';
      }
      return `${(Number(value) * 100).toFixed(1)}%`;
    }

    function rosterTeamName(teamName) {
      if (teamName === 'Czechia') {
        return 'Czech Republic';
      }
      if (teamName === 'Turkey') {
        return 'Turkiye';
      }
      if (teamName === 'USA') {
        return 'United States';
      }
      if (teamName === 'Curacao') {
        return 'Curaçao';
      }
      return teamName;
    }

    function scoreLabel(score) {
      const parts = [];
      if (score.wins) {
        parts.push(`${score.wins}W`);
      }
      if (score.draws) {
        parts.push(`${score.draws}D`);
      }
      if (score.goals) {
        parts.push(`${score.goals}G`);
      }
      if (score.stageBonus) {
        parts.push(`+${score.stageBonus}`);
      }
      return parts.length ? parts.join(' ') : '0W 0D 0G';
    }

    async function fetchScoreboard() {
      try {
        const response = await fetch(ESPN_SCOREBOARD_URL, { cache: 'no-store' });
        if (!response.ok) {
          throw new Error(`ESPN scoreboard returned ${response.status}`);
        }
        const data = await response.json();
        teamStats = statsFromMatches(data.events || []);
      } catch (error) {
        console.warn(error);
        teamStats = {};
      }
      renderStandings();
    }

    function statsFromMatches(matches) {
      const stats = {};
      for (const match of matches) {
        const competition = match.competitions?.[0] || {};
        const competitors = competition.competitors || [];
        const status = match.status?.type || {};
        if (status.state !== 'post' || competitors.length < 2) {
          continue;
        }

        const [first, second] = competitors;
        const firstName = displayTeamName(first.team?.displayName);
        const secondName = displayTeamName(second.team?.displayName);
        const firstScore = Number(first.score || 0);
        const secondScore = Number(second.score || 0);
        ensureStats(stats, firstName);
        ensureStats(stats, secondName);
        stats[firstName].goals += firstScore;
        stats[secondName].goals += secondScore;

        if (firstScore > secondScore) {
          stats[firstName].wins += 1;
        } else if (secondScore > firstScore) {
          stats[secondName].wins += 1;
        } else {
          stats[firstName].draws += 1;
          stats[secondName].draws += 1;
        }
      }
      return stats;
    }

    function ensureStats(stats, teamName) {
      if (!stats[teamName]) {
        stats[teamName] = { wins: 0, draws: 0, goals: 0 };
      }
    }

    function displayTeamName(value) {
      const normalized = normalize(value);
      for (const player of players) {
        for (const team of player.teams) {
          const candidates = [team.name, ...(teamAliases[team.name] || [])].map(normalize);
          if (candidates.includes(normalized)) {
            return team.name;
          }
        }
      }
      return value || '';
    }

    function normalize(value) {
      return String(value || '')
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, ' ')
        .trim();
    }

    function flagMarkup(teamName, theme) {
      if (!theme.flagCode) {
        return '';
      }
      return `<img class="team-flag" src="https://flagcdn.com/w80/${escapeHtml(theme.flagCode)}.png" alt="${escapeHtml(teamName)} flag" loading="lazy">`;
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, character => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;',
      }[character]));
    }

    function closeEstimatePopovers() {
      document.querySelectorAll('.estimate-details.is-open').forEach(details => {
        details.classList.remove('is-open');
      });
      if (document.activeElement?.classList?.contains('team-estimate')) {
        document.activeElement.blur();
      }
    }

    standingsGrid.addEventListener('click', event => {
      const trigger = event.target.closest('.team-estimate');
      if (!trigger) {
        return;
      }

      const details = trigger.closest('.estimate-details');
      if (!details) {
        return;
      }

      const shouldOpen = !details.classList.contains('is-open');
      closeEstimatePopovers();
      if (shouldOpen) {
        details.classList.add('is-open');
        trigger.focus({ preventScroll: true });
      }
      event.preventDefault();
      event.stopPropagation();
    });

    standingsGrid.addEventListener('keydown', event => {
      if (!event.target.classList.contains('team-estimate')) {
        return;
      }
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        event.target.click();
      } else if (event.key === 'Escape') {
        closeEstimatePopovers();
      }
    });

    document.addEventListener('pointerdown', event => {
      if (!event.target.closest('.estimate-details')) {
        closeEstimatePopovers();
      }
    });

    renderStandings();
    fetchScoreboard();
  </script>
</body>
</html>
