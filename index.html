<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>World Cup Rosters</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, Helvetica, sans-serif;
      background: #f6f7f9;
      color: #172033;
      --team-primary: #172033;
      --team-secondary: #d0d7e2;
      --team-primary-soft: rgba(23, 32, 51, 0.08);
      --team-secondary-soft: rgba(208, 215, 226, 0.18);
    }
    body {
      margin: 0;
      padding: 24px;
      background:
        linear-gradient(135deg, var(--team-primary-soft), transparent 38%),
        linear-gradient(315deg, var(--team-secondary-soft), transparent 42%),
        #f6f7f9;
    }
    main {
      max-width: 1180px;
      margin: 0 auto;
    }
    header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
      border-bottom: 4px solid var(--team-primary);
      padding-bottom: 16px;
    }
    .title-row {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }
    .team-flag {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 52px;
      height: 40px;
      border: 1px solid #d6dde8;
      border-radius: 6px;
      background: #fff;
      box-shadow: inset 0 -5px 0 var(--team-secondary);
      font-size: 30px;
      line-height: 1;
      flex: 0 0 auto;
    }
    h1 {
      margin: 0 0 4px;
      font-size: 28px;
      line-height: 1.15;
      color: var(--team-primary);
    }
    .meta {
      margin: 0;
      color: #667085;
      font-size: 14px;
    }
    label {
      display: grid;
      gap: 6px;
      color: #344054;
      font-size: 13px;
      font-weight: 700;
    }
    select {
      min-width: 240px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      background: white;
      color: #172033;
      font-size: 15px;
      padding: 9px 36px 9px 10px;
    }
    .summary {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 14px;
    }
    .pill {
      border: 1px solid color-mix(in srgb, var(--team-primary), #ffffff 68%);
      border-radius: 999px;
      background: color-mix(in srgb, var(--team-secondary), #ffffff 86%);
      padding: 7px 11px;
      color: #344054;
      font-size: 14px;
    }
    .table-wrap {
      overflow-x: auto;
      border: 1px solid color-mix(in srgb, var(--team-primary), #ffffff 72%);
      border-radius: 8px;
      background: white;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 900px;
    }
    th, td {
      padding: 10px 12px;
      border-bottom: 1px solid #edf0f5;
      text-align: left;
      font-size: 14px;
      white-space: nowrap;
    }
    th {
      position: sticky;
      top: 0;
      background: var(--team-primary);
      color: #ffffff;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0;
    }
    tbody tr:hover {
      background: #f8fafc;
    }
    tbody tr.starter {
      background: color-mix(in srgb, var(--team-secondary), #ffffff 82%);
      box-shadow: inset 4px 0 0 var(--team-secondary);
    }
    tbody tr.starter:hover {
      background: color-mix(in srgb, var(--team-secondary), #ffffff 74%);
    }
    .player {
      font-weight: 700;
      color: #111827;
    }
    .starter-badge {
      display: inline-flex;
      align-items: center;
      margin-left: 8px;
      border: 1px solid var(--team-primary);
      border-radius: 999px;
      background: var(--team-primary);
      color: #ffffff;
      padding: 2px 7px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
    }
    .club {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .club-logo {
      width: 22px;
      height: 22px;
      object-fit: contain;
      flex: 0 0 auto;
    }
    .muted {
      color: #667085;
    }
    @media (max-width: 720px) {
      body {
        padding: 16px;
      }
      header {
        align-items: stretch;
        flex-direction: column;
      }
      .team-flag {
        width: 46px;
        height: 36px;
        font-size: 26px;
      }
      select {
        width: 100%;
      }
    }
  </style>
</head>

          <td>${row.goals || '0'}</td>
          <td>${row.fifproApps || '0'}</td>
          <td>${row.fifproYears || '<span class="muted">-</span>'}</td>
        </tr>
      `).join('');
    }

    function applyTeamTheme(team) {
      const theme = teamThemes[team] || {
        flag: '🏆',
        primary: '#172033',
        secondary: '#d0d7e2',
      };
      const root = document.documentElement;
      root.style.setProperty('--team-primary', theme.primary);
      root.style.setProperty('--team-secondary', theme.secondary);
      root.style.setProperty('--team-primary-soft', hexToRgba(theme.primary, 0.10));
      root.style.setProperty('--team-secondary-soft', hexToRgba(theme.secondary, 0.16));
      teamTitle.textContent = `${team} Roster`;
      teamFlag.textContent = theme.flag;
      teamFlag.setAttribute('aria-label', `${team} flag`);
    }

    function hexToRgba(hex, alpha) {
      const value = hex.replace('#', '');
      const red = parseInt(value.slice(0, 2), 16);
      const green = parseInt(value.slice(2, 4), 16);
      const blue = parseInt(value.slice(4, 6), 16);
      return `rgba(${red}, ${green}, ${blue}, ${alpha})`;
    }

    function clubMarkup(row) {
      if (!row.club) {
        return '<span class="muted">-</span>';
      }
      const logo = row.clubLogoUrl
        ? `<img class="club-logo" src="${row.clubLogoUrl}" alt="" loading="lazy">`
        : '';
      return `<span class="club">${logo}<span>${row.club}</span></span>`;
    }

    teamSelect.addEventListener('change', event => renderTeam(event.target.value));
    renderTeam(teamSelect.value);
  </script>
</body>
</html>
